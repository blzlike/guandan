name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'guandan/**'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with official buildozer image
        run: |
          docker run --rm -u root --workdir /workspace \
            -v "$PWD:/workspace" \
            ghcr.io/kivy/buildozer:latest \
            bash -lc "cd guandan && buildozer --verbose android debug"

      - name: List build output
        run: ls -la guandan/bin || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guandan-apk
          path: guandan/bin/*.apk
