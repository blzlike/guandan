name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'guandan/**'
      - '.github/workflows/android.yml'

jobs:
  build-android:
    name: Build for Android
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore build caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer-cache/android
            ~/.gradle-cache
            guandan/.buildozer
          key: buildozer-v1-${{ hashFiles('guandan/buildozer.spec') }}
          restore-keys: buildozer-v1-

      - name: Build APK with official buildozer image
        run: |
          mkdir -p ~/.buildozer-cache/android ~/.gradle-cache
          docker run --rm \
            --volume "$PWD:/home/user/hostcwd" \
            --volume "$HOME/.buildozer-cache/android:/home/user/.buildozer/android" \
            --volume "$HOME/.gradle-cache:/home/user/.gradle" \
            --workdir /home/user/hostcwd/guandan \
            ghcr.io/kivy/buildozer:latest \
            --verbose android debug

      - name: List build output
        run: ls -la guandan/bin || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guandan-apk
          path: guandan/bin/*.apk
